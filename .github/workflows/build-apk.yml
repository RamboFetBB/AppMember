name: Build APK - Alertas Poke_membros

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Dependências
        run: npm install

      - name: Gerar Projeto Android Nativo (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Criar Bundle JavaScript Offline
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file node_modules/expo/AppEntry.js --asset-catalog-dest android/app/src/main/res --bundle-output android/app/src/main/assets/index.android.bundle

      - name: Gerar APK de Debug
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Fazer Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: Alertas-Poke_membros-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
